{% extends "base.html" %}{% block content %}
<div class="pagehead"><h1>Ventas</h1><a class="btn" href="/new-sale">Nueva venta</a></div>
<div class="card"><div class="tablewrap"><table><tr><th>Nº</th><th>Fecha</th><th>Vendedor</th><th>Cliente</th><th>Total</th><th>Pago</th><th></th></tr>{% for s in sales %}<tr><td>#{{s.id}}</td><td>{{s.created_at}}</td><td>{{s.username}}</td><td>{{s.customer}}</td><td>$ {{s.total|ars}}</td><td>{{s.payment}}</td><td><a class="btn small" href="/sale/{{s.id}}">Detalle</a></td></tr>{% endfor %}</table></div></div>{% endblock %}
