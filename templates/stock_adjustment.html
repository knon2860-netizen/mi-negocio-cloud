{% extends "base.html" %}{% block content %}<div class="pagehead"><h1>⚙ Ajuste manual de stock</h1><span class="badge">Solo Administrador / Dueño</span></div><div class="card"><p>Este movimiento modifica el stock y queda registrado en la auditoría. No se puede editar ni borrar después.</p><form method="post" class="formgrid" onsubmit="return confirm('¿Confirmar este ajuste de stock? El movimiento quedará registrado en la auditoría.')"><label>Producto *<select name="product_id" required><option value="">Seleccionar producto</option>{% for p in products %}<option value="{{p.id}}">{{p.name}} — stock: {{p.stock}}{% if p.fractional %} kg{% endif %}</option>{% endfor %}</select></label><label>Motivo *<select name="reason" required><option value="">Seleccionar motivo</option>{% for k,v in reasons.items() %}<option value="{{k}}">{{v}}</option>{% endfor %}</select></label><label>Operación *<select name="direction" required><option value="decrease">− Disminuir stock</option><option value="increase">+ Aumentar stock</option></select></label><label>Cantidad *<input name="quantity" type="number" min="0.001" step="0.001" required></label><label class="wide">Observación<textarea name="note" rows="4" placeholder="Describí el motivo del ajuste."></textarea></label><div class="wide"><button type="submit">Confirmar ajuste</button> <a class="button secondary" href="/stock/historial">Cancelar</a></div></form></div>{% endblock %}
